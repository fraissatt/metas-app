<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Sem conexão · Metas</title>
    <style>
      /* Self-contained on purpose: it is shown with no network, so it needs no
         stylesheet or script from the app, and it carries nothing about the person. */
      :root {
        --bg: #f4f6f9;
        --fg: #1b1f27;
        --muted: #5b6575;
        --card: #ffffff;
        --border: #dde2ea;
        --primary: #2563c9;
        --on-primary: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #111214;
          --fg: #e8eaed;
          --muted: #9aa0a8;
          --card: #17191c;
          --border: #2a2d32;
          --primary: #7fd18f;
          --on-primary: #0f1a12;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1rem;
        background: var(--bg);
        color: var(--fg);
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        line-height: 1.5;
      }
      main {
        width: 100%;
        max-width: 24rem;
        padding: 1.5rem;
        border: 1px solid var(--border);
        border-radius: 0.75rem;
        background: var(--card);
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.25rem;
      }
      p {
        margin: 0 0 1rem;
        color: var(--muted);
        font-size: 0.9375rem;
      }
      button {
        font: inherit;
        font-weight: 600;
        padding: 0.5rem 1rem;
        border: 0;
        border-radius: 0.5rem;
        background: var(--primary);
        color: var(--on-primary);
        cursor: pointer;
      }
      button:focus-visible {
        outline: 2px solid var(--primary);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Você está sem conexão</h1>
      <p>
        Suas metas e tarefas ficam guardadas com segurança no servidor e voltam assim que a internet voltar. Nada
        foi perdido.
      </p>
      <button type="button" id="retry">Tentar de novo</button>
    </main>
    <script>
      document.getElementById('retry').addEventListener('click', function () {
        location.reload()
      })
      // Back online: try the real page again by itself.
      window.addEventListener('online', function () {
        location.reload()
      })
    </script>
  </body>
</html>
