# GitHub only honours "Closes #n" when a PR lands on the default branch
# (master). Feature PRs land on develop, so their issues stayed open and had
# to be closed by hand. This closes them as soon as the PR is merged there.
name: Fechar issues na develop

on:
  pull_request:
    types: [closed]
    branches: [develop]

permissions:
  issues: write

jobs:
  fechar:
    name: Fechar issues citadas
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request
            // The same keywords GitHub uses: close(s|d), fix(es|ed), resolve(s|d).
            const pattern = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s*:?\s+#(\d+)\b/gi
            const numbers = [...new Set([...(pr.body ?? '').matchAll(pattern)].map((m) => Number(m[1])))]

            for (const issue_number of numbers) {
              const { data: issue } = await github.rest.issues.get({ ...context.repo, issue_number })
              // Skip pull requests and issues that are already closed.
              if (issue.pull_request || issue.state === 'closed') continue

              await github.rest.issues.createComment({
                ...context.repo,
                issue_number,
                body: `Entregue pelo PR #${pr.number}, mergeado na develop.`,
              })
              await github.rest.issues.update({ ...context.repo, issue_number, state: 'closed', state_reason: 'completed' })
              core.info(`Fechada a issue #${issue_number}`)
            }
