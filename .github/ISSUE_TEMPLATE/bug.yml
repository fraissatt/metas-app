name: Reportar bug
description: Algo não funciona como deveria
labels: ['tipo: bug']
body:
  - type: textarea
    id: o-que-aconteceu
    attributes:
      label: O que aconteceu
      description: Descreva o problema e onde ele aparece (tela, botão).
    validations:
      required: true
  - type: textarea
    id: passos
    attributes:
      label: Como reproduzir
      placeholder: |
        1. Entrar como visitante
        2. Abrir Objetivos
        3. ...
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: O que era esperado
    validations:
      required: true
  - type: input
    id: ambiente
    attributes:
      label: Onde
      description: Site online ou local, navegador e celular/computador.
